# capview: zoom / pan for live capture (arrows would seek in plain mpv)
+           add video-zoom  0.1
=           add video-zoom  0.1
KP_ADD      add video-zoom  0.1
-           add video-zoom -0.1
KP_SUBTRACT add video-zoom -0.1
WHEEL_UP    add video-zoom  0.1
WHEEL_DOWN  add video-zoom -0.1
RIGHT       add video-pan-x -0.05
LEFT        add video-pan-x  0.05
DOWN        add video-pan-y -0.05
UP          add video-pan-y  0.05
0           set video-zoom 0 ; set video-pan-x 0 ; set video-pan-y 0
BS          set video-zoom 0 ; set video-pan-x 0 ; set video-pan-y 0
f           cycle fullscreen
s           screenshot video
q           quit
